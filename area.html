<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Área do Participante — Só Pode PRO</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071426;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #050b14;
            border-bottom: 1px solid #26364d;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            color: #f5c542;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 70px 25px;
        }

        .loading {
            color: #aeb9c8;
        }

    </style>

</head>


<body>


<header>

    <div class="navbar">

        <div class="logo">
            SÓ PODE <span>PRO</span>
        </div>

    </div>

</header>


<main>

    <div
        class="loading"
        id="loading"
    >
        Iniciando...
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://xfhkdfponsyxeccolhon.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_mbHAOHKLz50fh_4DOeztkA_9vR_NlmV";


    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function testarSessao() {

        const loading =
            document.getElementById("loading");


        loading.textContent =
            "LENDO SESSÃO...";


        try {

            const resultado =
                await supabase.auth.getSession();


            console.log(
                "RESULTADO:",
                resultado
            );


            if (resultado.error) {

                loading.textContent =
                    "ERRO AO LER SESSÃO";

                return;

            }


            if (resultado.data.session) {

                loading.textContent =
                    "SESSÃO RECEBIDA!";

                console.log(
                    "USUÁRIO:",
                    resultado.data.session.user
                );

            } else {

                loading.textContent =
                    "NENHUMA SESSÃO!";

            }

        } catch (erro) {

            console.error(erro);

            loading.textContent =
                "ERRO AO EXECUTAR GETSESSION";

        }

    }


    testarSessao();

</script>

</body>

</html>

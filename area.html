<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Participante — Só Pode PRO</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071426;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #050b14;
            border-bottom: 1px solid #26364d;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            color: #f5c542;
        }

        .logout {
            background: transparent;
            border: 1px solid #26364d;
            color: #dce5f2;
            padding: 10px 15px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout:hover {
            border-color: #f5c542;
            color: #f5c542;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 70px 25px;
        }

        .welcome {
            color: #f5c542;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .description {
            color: #aeb9c8;
            font-size: 17px;
            line-height: 1.6;
            max-width: 650px;
        }

        .card {
            margin-top: 40px;
            background: #0d2039;
            border: 1px solid #26364d;
            border-radius: 14px;
            padding: 30px;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #aeb9c8;
            line-height: 1.5;
        }

        .loading {
            color: #aeb9c8;
        }

        .error {
            color: #f5c542;
        }

        @media (max-width: 600px) {

            main {
                padding: 50px 20px;
            }

            h1 {
                font-size: 36px;
            }

            .navbar {
                padding-left: 20px;
                padding-right: 20px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="navbar">

        <div class="logo">
            SÓ PODE <span>PRO</span>
        </div>

        <button
            class="logout"
            id="logoutButton"
            type="button"
        >
            SAIR
        </button>

    </div>

</header>


<main>

    <div
        class="loading"
        id="loading"
    >
        67
    </div>


    <div
        id="content"
        style="display:none;"
    >

        <div class="welcome">
            ÁREA DO PARTICIPANTE
        </div>

        <h1>
            Olá, <span id="nomeParticipante"></span>!
        </h1>

        <p class="description">
            Você está conectado à sua conta do Só Pode PRO.
            Aqui ficarão suas inscrições, informações e
            atividades como participante.
        </p>


        <div class="card">

            <h2>
                Sua conta
            </h2>

            <p>
                Participante:
                <strong id="nomeConta"></strong>
            </p>

        </div>

    </div>


    <div
        class="error"
        id="error"
        style="display:none;"
    ></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://xfhkdfponsyxeccolhon.supabase.co";


    const SUPABASE_KEY =
        "SUA_CHAVE_PUBLISHABLE";


    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function verificarLogin() {

        const loading =
            document.getElementById("loading");

        const content =
            document.getElementById("content");

        const error =
            document.getElementById("error");


        loading.textContent =
            "Verificando login...";


        const {
            data,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

            loading.style.display =
                "none";

            error.textContent =
                "Erro ao verificar o login.";

            error.style.display =
                "block";

            return;

        }


        const session =
            data.session;


        if (!session) {

            window.location.href =
                "login.html";

            return;

        }


        const userId =
            session.user.id;


        const {
            data: participante,
            error: participanteError
        } =
            await supabase
                .from("participantes")
                .select("nome")
                .eq("user_id", userId)
                .single();


        if (participanteError) {

            console.error(participanteError);

            loading.style.display =
                "none";

            error.textContent =
                "Participante não encontrado.";

            error.style.display =
                "block";

            return;

        }


        document
            .getElementById("nomeParticipante")
            .textContent =
                participante.nome;


        document
            .getElementById("nomeConta")
            .textContent =
                participante.nome;


        loading.style.display =
            "none";

        content.style.display =
            "block";

    }


    async function sair() {

        await supabase.auth.signOut();

        window.location.href =
            "login.html";

    }


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            sair
        );


    verificarLogin();

</script>

</body>
</html>

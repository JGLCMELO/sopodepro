 <!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área — Só Pode PRO</title>

</head>

<body>

    <div id="loading">

        Verificando sessão...

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    const loading =
        document.getElementById("loading");

    const SUPABASE_URL =
        "https://xfhkdfponsyxeccolhon.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_mbHAOHKLz50fh_4DOeztkA_9vR_NlmV";

    try {
        if (!window.supabase) {
            throw new Error(
                "Biblioteca do Supabase não foi carregada."
            );
        }

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        async function verificarSessao() {

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();

            if (
                sessionError ||
                !sessionData.session
            ) {
                window.location.href =
                    "login.html";
                return;
            }

            const userId =
                sessionData.session.user.id;

            loading.textContent =
                "Procurando participante...";

            const {
                data: participante,
                error: participanteError
            } =
                await supabaseClient
                    .from("participantes")
                    .select("nome")
                    .eq("user_id", userId)
                    .single();

            if (participanteError) {
                console.error(
                    participanteError
                );

                loading.textContent =
                    "Erro ao procurar participante.";

                return;
            }

            loading.textContent =
                "Olá, " +
                participante.nome +
                "! Login confirmado.";

        }

        verificarSessao();

    } catch (error) {

        console.error(error);

        loading.textContent =
            "Erro ao iniciar o Supabase.";

    }
</script>
</body>

</html>

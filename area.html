<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área — Só Pode PRO</title>

</head>

<body>

    <div id="loading">

        Verificando sessão...

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const loading = document.getElementById("loading");

        const SUPABASE_URL =

            "https://xfhkdfponsyxeccolhon.supabase.co";

        const SUPABASE_KEY =

            "sb_publishable_mbHAOHKLz50fh_4DOeztkA_9vR_NlmV";

        try {

            if (!window.supabase) {

                throw new Error("Biblioteca do Supabase não foi carregada.");

            }

            // Use outro nome para o cliente

            const supabaseClient =

                window.supabase.createClient(

                    SUPABASE_URL,

                    SUPABASE_KEY

                );

            async function verificarSessao() {
    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
        window.location.href = "login.html";
        return;
    }

    loading.textContent =
        "Login confirmado! Área liberada.";
}

            verificarSessao();

        } catch (error) {

            console.error(error);

            loading.textContent =

                "Erro ao iniciar o Supabase.";

        }

    </script>

</body>

</html>

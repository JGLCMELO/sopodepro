<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Área do Presidente — Só Pode PRO</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #071426;
            color: white;
        }

        header {
            background: #050b14;
            border-bottom: 1px solid #26364d;
            padding: 18px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #f5c542;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .presidente {
            color: #dce5f2;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 25px;
        }

        .hero {
            background:
                radial-gradient(
                    circle at 80% 30%,
                    #3b2a82 0%,
                    #11152f 45%,
                    #071426 80%
                );

            border: 1px solid #3b2a82;
            border-radius: 18px;

            padding: 40px;
            margin-bottom: 30px;
        }

        .hero small {
            color: #a78bfa;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hero h1 {
            margin-top: 10px;
            font-size: 38px;
        }

        .hero p {
            margin-top: 12px;
            color: #b8c5d6;
        }

        .card {
            background: #0d1830;
            border: 1px solid #26364d;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card h2 {
            color: #f5c542;
            margin-bottom: 18px;
        }

        .tabela {
            width: 100%;
            border-collapse: collapse;
        }

        .tabela th,
        .tabela td {
            padding: 14px 10px;
            border-bottom: 1px solid #26364d;
            text-align: left;
        }

        .tabela th {
            color: #a78bfa;
            font-size: 13px;
            text-transform: uppercase;
        }

        .tabela td {
            color: #dce5f2;
        }

        .sem-inscricao {
            color: #8796aa;
            padding: 15px 0;
        }

        .botao {
            margin-top: 20px;
            background: #f5c542;
            color: #071426;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            opacity: 0.9;
        }

        .erro {
            color: #ff8d8d;
            font-weight: bold;
        }

        #conteudo {
            display: none;
        }

        #carregando {
            text-align: center;
            padding: 60px 20px;
            color: #b8c5d6;
        }

.modalidade-presidente {
    background: #111f38;
    border: 1px solid #26364d;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
}

.titulo-modalidade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
}

.titulo-modalidade h3 {
    color: #f5c542;
    font-size: 18px;
}

.titulo-modalidade span {
    color: #a78bfa;
    font-weight: bold;
    font-size: 14px;
}

.lista-participantes {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.participante-inscrito {
    background: #071426;
    border: 1px solid #3b2a82;
    border-radius: 8px;
    padding: 9px 12px;
    color: #dce5f2;
    font-weight: bold;
}
        
        @media (max-width: 700px) {

            main {
                padding: 25px 15px;
            }

            .hero {
                padding: 25px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .tabela {
                font-size: 13px;
            }

            .tabela th,
            .tabela td {
                padding: 10px 6px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        SÓ PODE PRO
    </div>

    <div class="presidente">
        Presidente
    </div>

</header>


<main>


    <div id="carregando">
        Verificando acesso...
    </div>


    <div id="erro" class="erro"></div>


    <div id="conteudo">


        <section class="hero">

            <small>
                ADMINISTRAÇÃO OFICIAL
            </small>

            <h1>
                Área do Presidente
            </h1>

            <p>
                Painel administrativo do Só Pode PRO.
            </p>

        </section>


        <section class="card">

            <h2>
                Inscrições — Olimpíadas
            </h2>

            <div id="inscricoes">
                Carregando inscrições...
            </div>

            <button
                class="botao"
                onclick="carregarInscricoes()"
            >
                ATUALIZAR
            </button>

        </section>


    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://xfhkdfponsyxeccolhon.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_mbHAOHKLz50fh_4DOeztkA_9vR_NlmV";


let supabaseClient = null;


try {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

} catch (error) {

    console.error(error);

}


async function verificarPresidente() {

    const carregando =
        document.getElementById(
            "carregando"
        );

    const erro =
        document.getElementById(
            "erro"
        );

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if (
        sessionError ||
        !sessionData.session
    ) {

        window.location.href =
            "login.html";

        return;

    }


    const userId =
        sessionData.session.user.id;


    const {
        data: presidente,
        error
    } =
        await supabaseClient
            .from("presidentes")
            .select("id")
            .eq("user_id", userId)
            .maybeSingle();


    if (
        error ||
        !presidente
    ) {

        carregando.style.display =
            "none";

        erro.textContent =
            "Acesso negado. Esta área é exclusiva do Presidente.";

        return;

    }


    carregando.style.display =
        "none";

    conteudo.style.display =
        "block";


    carregarInscricoes();

}


window.carregarInscricoes =
    async function () {

        const area =
            document.getElementById(
                "inscricoes"
            );


        area.innerHTML =
            "Carregando inscrições...";


        const {
            data,
            error
        } =
            await supabaseClient
                .from("inscricoes_olimpiadas")
                .select(
                    "modalidade, user_id, created_at"
                )
                .order(
                    "modalidade"
                );


        if (error) {

            console.error(error);

            area.innerHTML =
                '<div class="erro">Não foi possível carregar as inscrições.</div>';

            return;

        }


        if (!data || data.length === 0) {

            area.innerHTML =
                '<div class="sem-inscricao">Nenhuma inscrição registrada.</div>';

            return;

        }


        const userIds =
            [
                ...new Set(
                    data.map(
                        inscricao =>
                            inscricao.user_id
                    )
                )
            ];


const {
    data: participantes,
    error: participantesError
} =
    await supabaseClient
        .from("participantes")
        .select(
            "nome, user_id"
        )
        .in(
            "user_id",
            userIds
        );


if (participantesError) {

    console.error(
        participantesError
    );

    area.innerHTML =
        '<div class="erro">Não foi possível carregar os participantes.</div>';

    return;

}


const nomes =
    {};


participantes.forEach(
    participante => {

        nomes[
            participante.user_id
        ] =
            participante.nome;

    }
);


        const modalidades = {};

data.forEach(
    inscricao => {

        if (
            !modalidades[
                inscricao.modalidade
            ]
        ) {

            modalidades[
                inscricao.modalidade
            ] = [];

        }


        const nome =
            nomes[
                inscricao.user_id
            ] ||
            "Participante";


        modalidades[
            inscricao.modalidade
        ].push(nome);

    }
);


let html = "";


Object.keys(modalidades)
    .sort()
    .forEach(
        modalidade => {

            const lista =
                modalidades[
                    modalidade
                ];


            html +=
                '<div class="modalidade-presidente">';


            html +=
                '<div class="titulo-modalidade">';


            html +=
                '<h3>' +
                modalidade +
                '</h3>';


            html +=
                '<span>' +
                lista.length +
                (
                    lista.length === 1
                        ? " inscrito"
                        : " inscritos"
                ) +
                '</span>';


            html +=
                '</div>';


            html +=
                '<div class="lista-participantes">';


            lista.forEach(
                nome => {

                    html +=
                        '<div class="participante-inscrito">' +
                        nome +
                        '</div>';

                }
            );


            html +=
                '</div>';


            html +=
                '</div>';

        }
    );


area.innerHTML =
    html;

    };


verificarPresidente();

</script>


</body>

</html>
